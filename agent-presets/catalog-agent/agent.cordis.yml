# Preset `catalog-agent`: el agente de catálogo de la tienda, migrado del script Python de
# ~/Documents/projects/dsh-plugin-catalog-agent a filas nativas del harness.
#
# Este fichero es la fuente de verdad versionada en el repo. Para activarlo se
# copia a `~/.dsh/.agent-presets/catalog-agent/` (ver README) y dsh lo recoge al
# reiniciar. La versión sigue semver (x.y.z) y se sube a mano en cada release;
# la fuente canónica es `version` en `dsh-plugin/package.json`, y el nombre del
# preset y la persona deben coincidir con ella.
#
# Reparto de planos: este fichero es el plano AGENTE. Las herramientas del vino
# se registran en el registro `tools` del host y no publican ningún servicio,
# así que su fila va suelta y sin realm aislado, igual que `tool-fs` en el
# preset `standard`. El modelo, la persistencia y el resto de registros siguen
# siendo del plano HOST: aquí no se tocan.
#
# Lo que en Python hacían `ModelPlugin` y `AgentLoop` ya no existe como código
# propio: el modelo es el del harness y el reintento ante una recomendación
# inválida lo hace el loop del agente cuando `wine_recommend` rechaza la llamada.

# ── identidad ────────────────────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      Eres el agente de una tienda de vinos, con el modelo {{model}}. Conectas la
      actualidad del sector con el catálogo de la tienda.

      Versión del código (dsh-plugin-catalog-agent): 0.1.0.


      Para una recomendación a partir de noticias, sigue este orden: primero
      `wine_rss_latest` para traer la noticia (una, salvo que te pidan más);
      después `wine_article_fetch` con su enlace, para leer el artículo entero;
      después `wine_stock_list` para ver qué hay en la tienda; y al final
      `wine_recommend` una sola vez, con el resumen que hayas escrito tú y
      exactamente un product_id del catálogo.


      El resumen va en español, en 2-3 frases, escrito por ti a partir del cuerpo
      que devolvió `wine_article_fetch`. El feed solo trae un titular y una frase:
      resumir a partir de eso obliga a inventar, y por eso se lee el artículo
      antes. Mira el campo `fuente` de la respuesta: si no es `articulo`, di
      explícitamente de cuánto material dispones y no afirmes nada que no esté
      ahí, aunque parezca razonable deducirlo del titular. El enlace se pasa tal
      cual venga de `wine_rss_latest`. Elige el vino por conexión real con la
      noticia —región, uva, tipo o contexto—, y dilo en el motivo; si la conexión
      es floja, reconócelo en vez de adornarla.


      Las fuentes de noticias las decide la tienda, no tú. Si el usuario pide una
      en concreto, pásala en el parámetro `fuente`; si pide "las noticias" sin
      más, omítelo y deja que se mezclen todas por fecha. Si alguna fuente falla,
      la herramienta lo dice: cuéntaselo al usuario en vez de callarlo.


      `wine_recommend` valida la propuesta y la rechaza si el product_id no está
      en el stock, si falta el motivo o si el resumen es demasiado corto. Si la
      rechaza, corrige lo que indique el error y vuelve a llamarla; no inventes
      product_id ni des por buena una recomendación que no haya pasado por ahí.


      Cuando la recomendación quede registrada, dale al usuario el titular, tu
      resumen, el vino recomendado con su precio y unidades en stock, y el
      motivo. Si te piden el JSON, entrega tal cual el que devolvió la
      herramienta.

# ── herramientas del vino ────────────────────────────────────────────────────
# `dsh-plugin-catalog-agent` está instalado en el perfil como dependencia enlazada
# (`dsh plugin --profile web add <ruta>`), así que la fila resuelve por nombre.
# `stockPath` es absoluta a propósito: el catálogo no depende del directorio de
# trabajo de la sesión. Ajústala a la ruta de este repo en la máquina donde se
# despliegue.
- id: catalog-tools
  name: dsh-plugin-catalog-agent
  config:
    stockPath: /Users/jonatannietoa/Documents/projects/dsh-plugin-catalog-agent/stock.json
    # Configuración de dominio del catálogo (fichero de entrada, mapeo de
    # columnas, taxonomía, descripciones, imágenes y Shopify). Está versionada en
    # `catalog.config.yml`, pero va comentada porque el plugin todavía no lee esa
    # clave: descoméntala cuando exista la etapa de ingesta.
    # configPath: /Users/jonatannietoa/Documents/projects/dsh-plugin-catalog-agent/catalog.config.yml
    # Las fuentes de noticias viven aquí, no en el código. Para añadir una, copia
    # el bloque: `id` es lo que el modelo pasa en el parámetro `fuente`, así que
    # que sea corto y sin espacios. Se leen todas en paralelo y se mezclan por
    # fecha; una fuente caída no tumba la llamada, solo se reporta.
    # Los cambios entran al abrir sesión nueva, con dsh reiniciado.
    feeds:
      - id: wine-searcher
        nombre: Wine-Searcher
        url: https://www.wine-searcher.com/rss-feed/dept/all
      # - id: decanter
      #   nombre: Decanter
      #   url: https://www.decanter.com/feed
    # Recorte del artículo. Por debajo del thresholdChars del podador de abajo,
    # para que el recorte lo decida esta herramienta y no el podador a ciegas.
    articleMaxChars: 6000

# ── preguntas al usuario ─────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── compactación ─────────────────────────────────────────────────────────────
# Copiado de `standard`: `compaction-basic` alcanza el podador con `ctx.get`, así
# que ambos comparten el mismo realm en lugar de quedar uno fuera.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
