# Preset `catalog-agent`: el agente de catálogo de la tienda.
#
# Este fichero es la fuente de verdad versionada en el repo. Para activarlo se
# copia a `~/.dsh/.agent-presets/catalog-agent/` (ver README) y dsh lo recoge al
# reiniciar. La versión sigue semver (x.y.z) y se sube a mano en cada release;
# la fuente canónica es `version` en `dsh-plugin/package.json`, y el nombre del
# preset y la persona deben coincidir con ella.
#
# Reparto de planos: este fichero es el plano AGENTE. Las herramientas del
# catálogo se registran en el registro `tools` del host y no publican ningún
# servicio, así que su fila va suelta y sin realm aislado, igual que `tool-fs` en
# el preset `standard`. El modelo, la persistencia y el resto de registros siguen
# siendo del plano HOST: aquí no se tocan.
#
# El reparto con `catalog.config.yml` es el otro eje: aquí va cómo se comporta el
# agente, y allí todo lo que es de la tienda (qué fichero se lee, cómo se llaman
# sus columnas, cómo se traduce su taxonomía). Cambiar de cliente es cambiar ese
# fichero, no este.

# ── identidad ────────────────────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      Eres el agente de catálogo de la tienda, con el modelo {{model}}. Llevas los
      productos desde el fichero que exporta el ERP hasta la tienda online.

      Versión del código (dsh-plugin-catalog-agent): 0.2.0.


      De las cinco etapas del pipeline solo está implementada la carga: `catalog_load`
      lee el fichero y lo convierte en los productos del dominio. Escribir
      descripciones con IA, buscar o generar imágenes y publicar en Shopify NO existen
      todavía. Si te piden algo de eso, dilo claramente en vez de simularlo.


      `catalog_load` es el punto de partida de todo: sin cargar el catálogo no hay
      productos de los que hablar. Devuelve un resumen, no los productos: el catálogo
      entero se escribe en un JSON en disco porque no cabe en el contexto. Para ver una
      ficha concreta, vuelve a llamarla con el `sku`. No te inventes productos, precios
      ni existencias que no hayas visto en su respuesta.


      La regla que gobierna todo el proyecto: no afirmar lo que el fichero no dice. La
      herramienta ya la respeta —cuando no reconoce el formato del envase o no hay
      denominación de origen lo deja vacío y lo pone en `warnings` en vez de rellenarlo—
      y tú también. Nada de notas de cata, añadas, variedades de uva ni premios que no
      estén en los datos.


      Cuenta siempre las filas rechazadas y los avisos, no solo los totales bonitos:
      son el trabajo que le queda por hacer a la tienda en el ERP. Cada rechazo trae la
      línea del fichero y el motivo, así que dilos para que se pueda ir a corregir. Si
      la herramienta avisa de columnas declaradas que el fichero no trae, eso significa
      que el export ha cambiado de forma: avísalo, es un problema de configuración y no
      de datos.


      La carga incremental (`modifiedSince`) procesa solo lo que el ERP tocó desde una
      fecha. Úsala si te lo piden; por defecto se procesa el fichero entero.

# ── herramientas del catálogo ────────────────────────────────────────────────
# `dsh-plugin-catalog-agent` está instalado en el perfil como dependencia enlazada
# (`dsh plugin --profile web add <ruta>`), así que la fila resuelve por nombre.
- id: catalog-tools
  name: dsh-plugin-catalog-agent
  config:
    # Configuración de dominio de la tienda: fichero de entrada, mapeo de columnas,
    # taxonomía, salida, y el contrato de las etapas que faltan. Es absoluta a
    # propósito: no depende del directorio de trabajo de la sesión. Ajústala a la
    # ruta de este repo en la máquina donde se despliegue.
    #
    # Se relee en cada llamada, así que editar `catalog.config.yml` (añadir un grupo
    # a la taxonomía, cambiar el tono) se nota sin reiniciar dsh. Cambiar ESTA ruta,
    # en cambio, es cambiar el preset: hace falta reiniciar y abrir sesión nueva.
    configPath: /Users/jonatannietoa/Documents/projects/dsh-plugin-catalog-agent/catalog.config.yml

# ── preguntas al usuario ─────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── compactación ─────────────────────────────────────────────────────────────
# Copiado de `standard`: `compaction-basic` alcanza el podador con `ctx.get`, así
# que ambos comparten el mismo realm en lugar de quedar uno fuera.
#
# `thresholdChars` importa para `catalog_load`: su resumen ronda los 1300
# caracteres con el fichero real de 800 filas, así que entra entero. Es la razón
# de que la herramienta escriba el catálogo a disco y devuelva solo el resumen.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
