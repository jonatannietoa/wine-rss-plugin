name: Agente de catálogo (0.1.0)
description: >-
  Agente de catálogo: carga los productos desde el fichero que exporta el ERP de la
  tienda y los convierte en fichas normalizadas (nombre, formato, tipo, tags, precio,
  coste y stock), diciendo qué filas ha rechazado y por qué. Las etapas de descripción
  con IA, imagen y publicación en Shopify todavía no están implementadas.
